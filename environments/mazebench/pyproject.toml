[project]
name = "mazebench"
version = "0.2.0"
description = "MazeBench Main World ASCII: tools-on/off with the canonical C++ engine and stock Verifiers harnesses."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "verifiers==0.3.2.dev121",
    "nodejs-wheel==24.16.0",
]

[project.urls]
Repository = "https://github.com/mazebench/MazeBenchBenchmarking"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["mazebench/**", "README.md", "pyproject.toml", "hatch_build.py", "configs/**", "tests/**", "validation/**"]
artifacts = ["mazebench/runtime/**"]

[tool.hatch.build.targets.wheel]
packages = ["mazebench"]

[tool.hatch.build.targets.wheel.force-include]
"pyproject.toml" = "pyproject.toml"
"hatch_build.py" = "hatch_build.py"
"configs" = "mazebench/configs"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "build>=1,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.verifiers.eval]
num_examples = 1
rollouts_per_example = 1
