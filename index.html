<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="A dependency-free canvas map of the complete MazeBench main world."
    >
    <title>MazeBench — Main World Map</title>
    <link rel="stylesheet" href="./render/v1/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="identity">
        <span class="world-mark" aria-hidden="true"></span>
        <div>
          <strong>MazeBench</strong>
          <span>Main World</span>
        </div>
      </div>

      <div class="runtime-meta" aria-live="polite">
        <span class="version">Renderer v1</span>
        <output id="status">Loading world map…</output>
      </div>

      <nav class="map-controls" aria-label="Map zoom">
        <a class="editor-link" href="./ice-maze/v1/">Ice Maze · World 2</a>
        <a id="play-link" class="editor-link" href="./play/v1/">Play v1</a>
        <a id="editor-link" class="editor-link" href="./editor/v1/">Editor v1</a>
        <a class="editor-link" href="./world-solver/v1/">World Solver v1</a>
        <a class="editor-link" href="./benchmarking/v1/">Benchmark v1</a>
        <button id="zoom-out" type="button" aria-label="Zoom out (E)">−</button>
        <button id="fit-map" type="button">Fit</button>
        <button id="zoom-in" type="button" aria-label="Zoom in (Q)">+</button>
      </nav>
    </header>

    <main
      id="viewport"
      class="viewport is-loading"
      tabindex="0"
      aria-label="Complete 16 by 16 MazeBench world map. Use A and D to rotate, W and S to tilt, arrow keys to pan, Q and E to zoom, and slash to center."
    >
      <div id="stage" class="stage">
        <canvas id="world" aria-label="Three-dimensional MazeBench main world"></canvas>
      </div>
      <div id="loading" class="loading-card" role="status">
        <span class="loading-indicator" aria-hidden="true"></span>
        <span>Reading 256 rooms</span>
      </div>
      <noscript>This map needs JavaScript to read and draw the level text files.</noscript>
    </main>

    <footer class="inspector" aria-live="polite">
      <div class="inspector-field inspector-room">
        <span>Room</span>
        <output id="room-value">—</output>
      </div>
      <div class="inspector-field inspector-file">
        <span>Source</span>
        <output id="file-value">Point at a room</output>
      </div>
      <div class="inspector-field inspector-cell">
        <span>Cell</span>
        <output id="cell-value">—</output>
      </div>
      <p class="hint">A/D rotate 90° · W/S tilt · arrows pan · hold Q/E zoom · / center · double-click focuses</p>
    </footer>

    <script type="module" src="./render/v1/main.mjs"></script>
  </body>
</html>
